name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        exclude:
          # ubuntu-latest is Ubuntu 26.04 now, and setup-python has no Python 3.9 build for it.
          - os: ubuntu-latest
            python-version: "3.9"
        include:
          - os: ubuntu-24.04
            python-version: "3.9"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Test
        run: python -m pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: ruff
        run: ruff check .
      - name: mypy
        run: mypy

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: No placeholders left
        # PyPI never accepts a second upload of the same version, so a placeholder
        # that gets published once stays there for good.
        run: |
          if grep -rIn --exclude-dir=.git --exclude-dir=.github -E "YOUR-USERNAME|YOUR NAME" .; then
            echo "Replace the placeholders listed above before releasing"; exit 1
          fi
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
      - name: Check package metadata
        run: twine check --strict dist/*
      - name: No bytecode inside the packages
        # An explicit "if": under `set -e` a line starting with "!" never fails the step.
        run: |
          if unzip -l dist/*.whl | grep -E "__pycache__|\.pyc"; then echo "bytecode in the wheel"; exit 1; fi
          if tar -tzf dist/*.tar.gz | grep -E "__pycache__|\.pyc"; then echo "bytecode in the sdist"; exit 1; fi
      - name: Smoke test the wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/todo-scan --version